name: Action self-test

on:
  push:
    branches: [main]
    paths:
      - 'nrg-action/**'
      - '.github/workflows/action-test.yml'
  pull_request:
    branches: [main]
    paths:
      - 'nrg-action/**'
      - '.github/workflows/action-test.yml'
  schedule:
    - cron: '0 6 * * 1'   # weekly Monday 06:00 UTC — catches drift in `latest` API / release format

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  matrix:
    name: ${{ matrix.os }} / ${{ matrix.mode }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        mode: [generate, check, validate]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Pre-stage golden files for check mode
        # check mode compares files-on-disk against what NRG would generate;
        # on a fresh checkout there are no *.md files next to sample.src.md, so
        # NRG would fail with "Missing file". Copy the goldens into place so
        # check has something to compare against and exits 0 cleanly.
        if: matrix.mode == 'check'
        shell: bash
        run: |
          cp nrg-action/test-fixtures/expected/sample.md    nrg-action/test-fixtures/sample.md
          cp nrg-action/test-fixtures/expected/sample.ru.md nrg-action/test-fixtures/sample.ru.md

      - name: Run action against fixture
        uses: ./nrg-action
        with:
          file: nrg-action/test-fixtures/sample.src.md
          mode: ${{ matrix.mode }}
          nrg-version: v1.0

      - name: Verify generate output
        if: matrix.mode == 'generate'
        shell: bash
        run: |
          diff -u nrg-action/test-fixtures/expected/sample.md    nrg-action/test-fixtures/sample.md
          diff -u nrg-action/test-fixtures/expected/sample.ru.md nrg-action/test-fixtures/sample.ru.md

  dogfood:
    name: Dogfood — validate repo's own README.src.md
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '17'
      # Build NRG from the checkout instead of downloading a pinned release.
      # README.src.md routinely uses widgets added AFTER the last tag (e.g. the
      # `details` widget post-dates v1.0), so validating it against a frozen
      # release jar produces a permanent false "unknown widget" failure. Dogfood
      # must test HEAD's code against HEAD's templates; the matrix jobs above
      # already cover the published-action download path against a stable fixture.
      # gpg/javadoc are skipped because the parent pom binds them to every build.
      - name: Build NRG from source
        run: mvn --batch-mode --no-transfer-progress -pl nrg -am package -DskipTests -Dgpg.skip=true -Dmaven.javadoc.skip=true
      - name: Validate README.src.md with the freshly built NRG
        # `validate` (not `check`): docs/widgets/WidgetDate.src.md renders
        # ${widget:date} live, so a regeneration-based `check` would be
        # permanently red on the changing timestamp. validate is the strongest
        # gate that stays deterministic.
        run: java -cp nrg/target/nrg.jar com.nanolaba.nrg.NRG -f README.src.md --validate
